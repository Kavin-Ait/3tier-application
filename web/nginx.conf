server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API health check to the api service
    location /health {
        proxy_pass http://api:4000/health;
        proxy_set_header Host $host;
    }

    # Reverse-proxy API routes to the api service
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
    }

    # Everything else serves the static placeholder page
    location / {
        try_files $uri $uri/ =404;
    }
}